# Public entry point (backend.md 8.5). backend-down deletes it to release
# the LB IP; backend-up applies it again.
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-backend
  labels:
    app: sentinel-backend
spec:
  type: LoadBalancer
  selector:
    app: sentinel-backend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
