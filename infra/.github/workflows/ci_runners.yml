# ─────────────────────────────────────────────────────────────────────────────
# Build the CI runner image and publish it to ACR.  (architecture/infra.md §6.3)
#
# Path-filtered to ci-images/** so a Terraform change does not rebuild a ~1 GB
# image for nothing. ci-images/build-push.sh does the same job by hand; it exists
# only to break the bootstrap circularity (this workflow needs an ACR that the
# first apply creates). After the first push this workflow owns every rebuild,
# which is what keeps the image corresponding to a commit on main rather than to
# whatever was on someone's laptop.
#
# ── TAGGING: immutable sha-* tags, a moving `latest`, keep the newest N ───────
# Until 2026-08-24 this published `latest` and nothing else. That has no version
# history and no way back: if a rebuild picks up a broken ruff, every consuming
# repo breaks at once and there is no older image to point at.
#
#   sha-<7>   immutable. THE version. Never moves, never reused.
#   latest    convenience alias, always the newest build.
#
# Rolling `previous` / `previous-2` aliases were considered and rejected. A
# fallback whose meaning changes on the next build is not a fallback — you pin to
# one precisely because you want it to stay still. `sha-` tags do that; aliases
# cannot. Retention keeps the newest N, so the last few versions are always there
# to pin to.
#
# Cleanup uses `az acr repository untag`, NOT `delete`. `delete --image repo:tag`
# removes the underlying MANIFEST and every tag pointing at it — so deleting an
# old sha- tag whose manifest is shared with `latest` (an identical rebuild has
# the same digest) would take `latest` with it. `untag` removes only the
# reference.
# ─────────────────────────────────────────────────────────────────────────────

name: "Runner Image — Build & Deploy to ACR"

# The image is identified by the commit it was built from, so the run says so.
# A dispatch that also applies an alias tag names the alias — that is the whole
# reason someone dispatched it by hand.
run-name: >-
  Runner Image - build for sha-${{ github.sha }}${{ inputs.extra_tag && format(' and {0}', inputs.extra_tag) }}

on:
  push:
    branches: [main]
    paths:
      - 'ci-images/**'
  workflow_dispatch:
    inputs:
      extra_tag:
        description: 'Additional tag beside sha-<sha> and latest (e.g. "known-good"). Blank for none.'
        type: string
        required: false
        default: ''
      keep:
        description: 'How many sha-* tags to retain. The newest N survive; older ones are untagged.'
        type: number
        required: false
        default: 3
      update_latest:
        description: 'Move `latest` to this build. Turn OFF to publish a sha-only test image.'
        type: boolean
        required: false
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: infra-runners
  cancel-in-progress: true

env:
  # Duplicates var.registry_name's default. A workflow cannot read a Terraform
  # variable, so this is unavoidable — the same duplication as the storage
  # account name in backend.tf and oidc.tf. Change them together.
  ACR_NAME: acrsentinelplat2fef
  IMAGE_REPO: ci-runner

jobs:
  build-and-push:
    name: Build and Push Runner Image
    runs-on: ubuntu-latest

    # Pushing an image is a WRITE, so this uses gha-deploy — and gha-deploy
    # federates only on environment subjects. Without this the job presents a
    # branch subject that no identity trusts.
    environment: production

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_DEPLOY }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Exchanges the Azure credential for a short-lived ACR token and writes it
      # into the docker config. No registry password is stored anywhere.
      - name: Log in to ACR
        run: az acr login --name "${ACR_NAME}"

      # Assigned first, then echoed. `echo "x=$(az …)"` returns ECHO's status, so
      # an az failure would write an empty output and the build would target no
      # registry — surfacing later as an unintelligible docker tag error.
      - name: Resolve login server and version
        id: meta
        run: |
          login_server="$(az acr show --name "${ACR_NAME}" --query loginServer -o tsv)"
          echo "login_server=${login_server}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # ubuntu-latest is x86-64 and this image runs as a job `container:` on that
      # host, never as an AKS pod — so it is amd64, unlike the backend image the
      # ARM64 node pool forces. Explicit rather than implicit: the default is
      # already right, but stating it stops a future self-hosted or arm64 runner
      # silently changing the answer.
      - name: Build
        env:
          IMAGE: ${{ steps.meta.outputs.login_server }}/${{ env.IMAGE_REPO }}
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
          EXTRA_TAG: ${{ inputs.extra_tag }}
          SKIP_LATEST: ${{ inputs.update_latest == false }}
        run: |
          tags=(--tag "${IMAGE}:${SHA_TAG}")
          if [ "${SKIP_LATEST}" != "true" ]; then
            tags+=(--tag "${IMAGE}:latest")
          fi
          if [ -n "${EXTRA_TAG}" ]; then
            tags+=(--tag "${IMAGE}:${EXTRA_TAG}")
          fi
          echo "publishing: ${tags[*]}"
          docker build \
            --platform linux/amd64 \
            --file ci-images/ci-runner.Dockerfile \
            "${tags[@]}" \
            ci-images

      - name: Push
        env:
          IMAGE: ${{ steps.meta.outputs.login_server }}/${{ env.IMAGE_REPO }}
        run: docker push --all-tags "${IMAGE}"

      # Retention. `|| true` on the untag: a tag that vanished between listing
      # and deleting is the desired end state, not something worth failing a
      # green build over.
      - name: Retain only the newest sha-* tags
        env:
          KEEP: ${{ inputs.keep || 3 }}
        run: |
          mapfile -t stale < <(
            az acr repository show-tags \
              --name "${ACR_NAME}" --repository "${IMAGE_REPO}" \
              --orderby time_desc -o tsv \
            | grep '^sha-' | tail -n "+$((KEEP + 1))"
          )
          if [ ${#stale[@]} -eq 0 ]; then
            echo "nothing to prune (keeping newest ${KEEP})"
            exit 0
          fi
          for tag in "${stale[@]}"; do
            echo "untagging ${IMAGE_REPO}:${tag}"
            az acr repository untag --name "${ACR_NAME}" \
              --image "${IMAGE_REPO}:${tag}" || true
          done

      - name: Summary
        env:
          IMAGE: ${{ steps.meta.outputs.login_server }}/${{ env.IMAGE_REPO }}
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
        run: |
          {
            echo "### Runner image published"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| version | \`${IMAGE}:${SHA_TAG}\` |"
            echo "| commit | ${GITHUB_SHA} |"
            echo ""
            echo "Pin a consuming workflow to the sha tag to freeze it:"
            echo ""
            echo '```yaml'
            echo "container:"
            echo "  image: ${IMAGE}:${SHA_TAG}"
            echo '```'
            echo ""
            echo "Tags now in ACR:"
            echo ""
            echo '```'
            az acr repository show-tags --name "${ACR_NAME}" \
              --repository "${IMAGE_REPO}" --orderby time_desc -o tsv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
