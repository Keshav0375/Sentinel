[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "sentinel"
version = "0.1.0"
description = "Autonomous DevOps incident response agent"
requires-python = ">=3.12"
dependencies = [
    "openai-agents>=0.0.14",
    "openai>=1.0.0",
    "google-genai>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiosqlite>=0.20.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "sentence-transformers>=3.0.0",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.poetry]
packages = [
    { include = "sentinel", from = "src" },
    { include = "data" },
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
ruff = ">=0.4.0"
pyright = ">=1.1.0"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src"]
strict = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
