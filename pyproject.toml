[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "sentinel"
version = "0.1.0"
description = "Autonomous DevOps incident response agent"
requires-python = ">=3.12,<3.14"
dependencies = [
    "openai-agents[litellm]>=0.0.14",
    "litellm>=1.105.0",
    "openai>=1.0.0",
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.2",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "sentence-transformers>=5.6.0,<6.0.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "langfuse>=3.0.0,<4.0.0",
    "pyjwt[crypto]>=2.15.1",
    "azure-identity>=1.26.0",
    "azure-keyvault-secrets>=4.11.3",
    "pyyaml>=6.0.0",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.poetry]
packages = [
    { include = "sentinel", from = "src" },
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
ruff = ">=0.4.0"
pyright = ">=1.1.0"
pip-audit = ">=2.10.0"
numpy = ">=2.0.0"
pytest-timeout = ">=2.3.0"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
# The repo-root alembic/ migrations dir would otherwise make `alembic` look first-party.
known-third-party = ["alembic"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src"]
strict = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 120
