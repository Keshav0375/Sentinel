name: CI

on:
  pull_request:
    branches: [main, release-phase-2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Poetry exports poetry.lock for scripts/install_locked.py; pinned so the export is
  # reproducible.
  POETRY_VERSION: "2.5.1"
  POETRY_PLUGIN_EXPORT_VERSION: "1.10.1"

jobs:
  # ── 1. Setup: Python + deps + cache ─────────────────────────────────────
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809  # v4.2.4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}
          restore-keys: pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Install Poetry + export plugin
        run: |
          pipx install "poetry==${POETRY_VERSION}"
          pipx inject poetry "poetry-plugin-export==${POETRY_PLUGIN_EXPORT_VERSION}"

      # Exactly the poetry.lock set (main + dev: pytest, ruff, pyright, pip-audit), hash
      # checked, with the CPU-only torch wheel. `pip install .` would re-resolve the
      # pyproject ranges and test a different dependency set from the one audited.
      - name: Install locked dependencies (CPU-only torch)
        run: python scripts/install_locked.py

  # ── 2. Branch Convention ─────────────────────────────────────────────────
  branch-convention:
    name: Branch Convention
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        # Passed through env, never inlined: a branch name is attacker-controlled text.
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          # `dev/` is the Phase-2 implementation prefix: one branch per phase,
          # e.g. dev/backend-phase-1-data-layer -> release-phase-2.
          PATTERN="^(dev|feat|fix|refactor|ci|docs|test|chore|planning|ai|hotfix)/[a-z0-9._-]+$"

          # release-phase-2 is the Phase 2 integration branch that merges into main.
          if [[ "$BRANCH" == "release-phase-2" ]]; then
            echo "✅ Integration branch '$BRANCH' — allowed"
            exit 0
          fi

          if [[ ! "$BRANCH" =~ $PATTERN ]]; then
            echo "❌ Branch name '$BRANCH' does not match convention"
            echo ""
            echo "Format: <type>/<description>"
            echo "Types: feat, fix, refactor, ci, docs, test, chore, planning, ai, hotfix"
            echo "Examples: feat/postgres-migration, fix/agent-retry-loop, ci/add-deploy-workflow"
            exit 1
          fi
          echo "✅ Branch name '$BRANCH' follows convention"

  # ── 3. Unit Tests: all checks as steps in one job ────────────────────────
  unit-tests:
    name: Unit Tests
    needs: [branch-convention]
    runs-on: ubuntu-latest
    # The database tests (pool, migrations, seed, lifespan) run against a real pgvector
    # server. tests/conftest.py fails them, rather than skipping, when CI=true and
    # TEST_DATABASE_URL is missing.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore pip cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809  # v4.2.4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}
          restore-keys: pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Install Poetry + export plugin
        run: |
          pipx install "poetry==${POETRY_VERSION}"
          pipx inject poetry "poetry-plugin-export==${POETRY_PLUGIN_EXPORT_VERSION}"

      # Exactly the poetry.lock set (main + dev: pytest, ruff, pyright, pip-audit), hash
      # checked, with the CPU-only torch wheel. `pip install .` would re-resolve the
      # pyproject ranges and test a different dependency set from the one audited.
      - name: Install locked dependencies (CPU-only torch)
        run: python scripts/install_locked.py

      - name: Secret leak check
        run: |
          echo "Scanning for leaked secrets in tracked files..."
          FOUND=0

          PATTERNS=(
            'sk-[a-zA-Z0-9]{20,}'
            'sk-ant-[a-zA-Z0-9_-]{20,}'
            'gsk_[a-zA-Z0-9]{20,}'
            'ghp_[a-zA-Z0-9]{36}'
            'github_pat_[a-zA-Z0-9_]{60,}'
            'xoxb-[0-9]{10,}-[0-9]{10,}-[a-zA-Z0-9]{24}'
            'AKIA[0-9A-Z]{16}'
            'eyJ[a-zA-Z0-9_-]{20,}\.[a-zA-Z0-9_-]{20,}'
            'postgres://[^:]+:[^@]+@'
            'redis://:[^@]+@'
          )

          for pattern in "${PATTERNS[@]}"; do
            MATCHES=$(git grep -lP "$pattern" -- ':!.env.example' ':!.github/' ':!tests/' ':!*.md' ':!*.lock' 2>/dev/null || true)
            if [[ -n "$MATCHES" ]]; then
              echo "❌ Potential secret matching: $pattern"
              echo "$MATCHES" | while read -r f; do echo "   → $f"; done
              FOUND=1
            fi
          done

          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "❌ .env file is tracked — must be in .gitignore"
            FOUND=1
          fi

          if git ls-files --error-unmatch .env.local 2>/dev/null; then
            echo "❌ .env.local is tracked — must be in .gitignore"
            FOUND=1
          fi

          KEY_FILES=$(git ls-files '*.pem' '*.key' '*.p12' '*.pfx' 'id_rsa*' 'id_ed25519*' 2>/dev/null || true)
          if [[ -n "$KEY_FILES" ]]; then
            echo "❌ Private key files tracked:"
            echo "$KEY_FILES" | while read -r f; do echo "   → $f"; done
            FOUND=1
          fi

          if [[ "$FOUND" -eq 1 ]]; then
            echo ""
            echo "Remove secrets, rotate compromised keys, use GitHub Secrets instead."
            exit 1
          fi

          echo "✅ No secrets detected"

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Ruff format
        run: ruff format --check src/ tests/

      - name: Pyright type check
        run: pyright src/

      # 002_seed_services embeds its row with the real all-MiniLM-L6-v2 model.
      - name: Cache embedding model
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809  # v4.2.4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Pytest
        run: python -m pytest tests/ -x --tb=short -q
        env:
          GROQ_API_KEY: "fake-key-for-ci"
          TEST_DATABASE_URL: "postgresql://postgres:test@localhost:5432/sentinel"

  # ── 4. Summary: collect results and post table ───────────────────────────
  summary:
    name: Summary
    needs: [setup, branch-convention, unit-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate results
        id: eval
        run: |
          SETUP="${{ needs.setup.result }}"
          BRANCH="${{ needs.branch-convention.result }}"
          TESTS="${{ needs.unit-tests.result }}"
          PASS=true

          {
            echo "setup=$SETUP"
            echo "branch=$BRANCH"
            echo "tests=$TESTS"
          } >> "$GITHUB_OUTPUT"

          if [[ "$SETUP" != "success" ]]; then PASS=false; fi
          if [[ "$BRANCH" != "success" ]]; then PASS=false; fi
          if [[ "$TESTS" != "success" ]]; then PASS=false; fi

          echo "pass=$PASS" >> "$GITHUB_OUTPUT"

      - name: Post summary table
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        with:
          script: |
            const s = {
              setup:  '${{ steps.eval.outputs.setup }}',
              branch: '${{ steps.eval.outputs.branch }}',
              tests:  '${{ steps.eval.outputs.tests }}',
            };
            const pass = '${{ steps.eval.outputs.pass }}' === 'true';
            const icon = (r) => r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌';
            const sha = context.sha.substring(0, 7);
            const ref = context.ref.replace('refs/heads/', '').replace('refs/pull/', 'PR #').replace('/merge', '');

            let md = `## ${pass ? '✅' : '❌'} CI Summary\n\n`;
            md += `**Ref:** \`${ref}\` | **Commit:** \`${sha}\` | **Run:** [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\n`;
            md += `| Job | Status |\n|-----|--------|\n`;
            md += `| Setup | ${icon(s.setup)} ${s.setup} |\n`;
            md += `| Branch Convention | ${icon(s.branch)} ${s.branch} |\n`;
            md += `| Unit Tests | ${icon(s.tests)} ${s.tests} |\n\n`;
            md += pass ? '**All checks passed — ready to merge.**\n' : '**One or more checks failed — merge blocked.**\n';

            await core.summary.addRaw(md).write();

      - name: Block merge on failure
        if: steps.eval.outputs.pass != 'true'
        run: exit 1
