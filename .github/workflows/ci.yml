name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: Branch Name Convention
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        run: |
          BRANCH="${{ github.head_ref }}"
          PATTERN="^(feat|fix|refactor|ci|docs|test|chore|planning|ai|hotfix)/[a-z0-9._-]+$"

          if [[ ! "$BRANCH" =~ $PATTERN ]]; then
            echo "❌ Branch name '$BRANCH' does not match naming convention"
            echo ""
            echo "Branch names must follow: <type>/<description>"
            echo ""
            echo "  Types: feat, fix, refactor, ci, docs, test, chore, planning, ai, hotfix"
            echo "  Description: lowercase, hyphens/dots/underscores allowed, no spaces"
            echo ""
            echo "  Examples:"
            echo "    feat/postgres-migration"
            echo "    fix/agent-retry-loop"
            echo "    ci/add-deploy-workflow"
            echo "    planning/phase-2-e2e"
            echo "    ai/triage-prompt-v2"
            echo "    hotfix/auth-null-check"
            exit 1
          fi
          echo "✅ Branch name '$BRANCH' follows convention"

  secrets:
    name: Secret Leak Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for hardcoded secrets
        run: |
          echo "Scanning for leaked secrets in tracked files..."
          FOUND=0

          PATTERNS=(
            'sk-[a-zA-Z0-9]{20,}'                           # OpenAI keys
            'sk-ant-[a-zA-Z0-9_-]{20,}'                     # Anthropic keys
            'gsk_[a-zA-Z0-9]{20,}'                          # Groq keys
            'ghp_[a-zA-Z0-9]{36}'                           # GitHub PAT
            'github_pat_[a-zA-Z0-9_]{60,}'                  # GitHub fine-grained PAT
            'xoxb-[0-9]{10,}-[0-9]{10,}-[a-zA-Z0-9]{24}'   # Slack bot token
            'AKIA[0-9A-Z]{16}'                              # AWS access key
            'eyJ[a-zA-Z0-9_-]{20,}\.[a-zA-Z0-9_-]{20,}'    # JWT tokens
            'postgres://[^:]+:[^@]+@'                       # Postgres connection with password
            'redis://:[^@]+@'                               # Redis connection with password
          )

          for pattern in "${PATTERNS[@]}"; do
            MATCHES=$(git grep -lP "$pattern" -- ':!.env.example' ':!.github/' ':!tests/' ':!*.md' ':!*.lock' 2>/dev/null || true)
            if [[ -n "$MATCHES" ]]; then
              echo "❌ Potential secret matching: $pattern"
              echo "$MATCHES" | while read -r f; do echo "   → $f"; done
              FOUND=1
            fi
          done

          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "❌ .env file is tracked — must be in .gitignore"
            FOUND=1
          fi

          if git ls-files --error-unmatch .env.local 2>/dev/null; then
            echo "❌ .env.local is tracked — must be in .gitignore"
            FOUND=1
          fi

          KEY_FILES=$(git ls-files '*.pem' '*.key' '*.p12' '*.pfx' 'id_rsa*' 'id_ed25519*' 2>/dev/null || true)
          if [[ -n "$KEY_FILES" ]]; then
            echo "❌ Private key files tracked:"
            echo "$KEY_FILES" | while read -r f; do echo "   → $f"; done
            FOUND=1
          fi

          if [[ "$FOUND" -eq 1 ]]; then
            echo ""
            echo "Remove secrets, rotate compromised keys, use GitHub Secrets instead."
            exit 1
          fi

          echo "✅ No secrets detected"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check src/ tests/

      - name: Run ruff format check
        run: ruff format --check src/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]" 2>/dev/null || pip install -e . && pip install pyright

      - name: Run pyright
        run: pyright src/

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]" 2>/dev/null || (pip install -e . && pip install pytest pytest-asyncio)

      - name: Run unit tests
        run: pytest tests/ -x --tb=short -q
        env:
          GROQ_API_KEY: "fake-key-for-ci"
          SENTINEL_DB_PATH: ":memory:"

  gate:
    name: CI Gate
    needs: [secrets, lint, typecheck, test, branch-name]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate results
        id: eval
        run: |
          LINT="${{ needs.lint.result }}"
          TYPE="${{ needs.typecheck.result }}"
          TEST="${{ needs.test.result }}"
          BRANCH="${{ needs.branch-name.result }}"
          SECRETS="${{ needs.secrets.result }}"
          PASS=true

          echo "secrets=$SECRETS" >> "$GITHUB_OUTPUT"
          echo "lint=$LINT" >> "$GITHUB_OUTPUT"
          echo "typecheck=$TYPE" >> "$GITHUB_OUTPUT"
          echo "test=$TEST" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          if [[ "$BRANCH" != "success" && "$BRANCH" != "skipped" ]]; then
            PASS=false
          fi
          if [[ "$SECRETS" != "success" ]]; then PASS=false; fi
          if [[ "$LINT" != "success" ]]; then PASS=false; fi
          if [[ "$TYPE" != "success" ]]; then PASS=false; fi
          if [[ "$TEST" != "success" ]]; then PASS=false; fi

          echo "pass=$PASS" >> "$GITHUB_OUTPUT"

      - name: Post summary
        uses: actions/github-script@v7
        with:
          script: |
            const s = {
              secrets:   '${{ steps.eval.outputs.secrets }}',
              lint:      '${{ steps.eval.outputs.lint }}',
              typecheck: '${{ steps.eval.outputs.typecheck }}',
              test:      '${{ steps.eval.outputs.test }}',
              branch:    '${{ steps.eval.outputs.branch }}',
            };
            const pass = '${{ steps.eval.outputs.pass }}' === 'true';
            const icon = (r) => r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌';
            const sha = context.sha.substring(0, 7);
            const ref = context.ref.replace('refs/heads/', '').replace('refs/pull/', 'PR #').replace('/merge', '');

            let md = `## ${pass ? '✅' : '❌'} CI Summary\n\n`;
            md += `**Ref:** \`${ref}\` | **Commit:** \`${sha}\` | **Run:** [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\n`;
            md += `| Job | Status |\n|-----|--------|\n`;
            md += `| Secret Leak Check | ${icon(s.secrets)} ${s.secrets} |\n`;
            md += `| Lint | ${icon(s.lint)} ${s.lint} |\n`;
            md += `| Type Check | ${icon(s.typecheck)} ${s.typecheck} |\n`;
            md += `| Tests | ${icon(s.test)} ${s.test} |\n`;
            md += `| Branch Name | ${icon(s.branch)} ${s.branch} |\n\n`;
            md += pass ? '**All checks passed — ready to merge.**\n' : '**One or more checks failed — merge blocked.**\n';

            await core.summary.addRaw(md).write();

      - name: Fail if any check failed
        if: steps.eval.outputs.pass != 'true'
        run: exit 1
