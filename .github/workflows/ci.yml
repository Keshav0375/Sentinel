name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: Branch Name Convention
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        run: |
          BRANCH="${{ github.head_ref }}"
          PATTERN="^(feat|fix|refactor|ci|docs|test|chore|planning|ai|hotfix)/[a-z0-9._-]+$"

          if [[ ! "$BRANCH" =~ $PATTERN ]]; then
            echo "❌ Branch name '$BRANCH' does not match naming convention"
            echo ""
            echo "Branch names must follow: <type>/<description>"
            echo ""
            echo "  Types: feat, fix, refactor, ci, docs, test, chore, planning, ai, hotfix"
            echo "  Description: lowercase, hyphens/dots/underscores allowed, no spaces"
            echo ""
            echo "  Examples:"
            echo "    feat/postgres-migration"
            echo "    fix/agent-retry-loop"
            echo "    ci/add-deploy-workflow"
            echo "    planning/phase-2-e2e"
            echo "    ai/triage-prompt-v2"
            echo "    hotfix/auth-null-check"
            exit 1
          fi
          echo "✅ Branch name '$BRANCH' follows convention"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check src/ tests/

      - name: Run ruff format check
        run: ruff format --check src/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]" 2>/dev/null || pip install -e . && pip install pyright

      - name: Run pyright
        run: pyright src/

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]" 2>/dev/null || (pip install -e . && pip install pytest pytest-asyncio)

      - name: Run unit tests
        run: pytest tests/ -x --tb=short -q
        env:
          GROQ_API_KEY: "fake-key-for-ci"
          SENTINEL_DB_PATH: ":memory:"

  gate:
    name: CI Gate
    needs: [lint, typecheck, test, branch-name]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          LINT="${{ needs.lint.result }}"
          TYPE="${{ needs.typecheck.result }}"
          TEST="${{ needs.test.result }}"
          BRANCH="${{ needs.branch-name.result }}"

          # branch-name only runs on PRs, skip check on push
          if [[ "$BRANCH" != "success" && "$BRANCH" != "skipped" ]]; then
            echo "❌ Branch name check failed"
            exit 1
          fi

          if [[ "$LINT" != "success" ]] || \
             [[ "$TYPE" != "success" ]] || \
             [[ "$TEST" != "success" ]]; then
            echo "❌ One or more CI jobs failed"
            echo "  lint: $LINT | typecheck: $TYPE | test: $TEST"
            exit 1
          fi
          echo "✅ All CI checks passed"
