name: Guard main source

# Enforces the allowed PR *source* branches for protected targets — something
# GitHub branch protection / rulesets cannot do natively. The workflow lives on
# the PROTECTED branches (main, release-phase-2); for a `pull_request` event
# GitHub runs the copy from the PR's BASE branch, so it applies to every PR into
# those targets regardless of what the head branch contains.
#
# Keep the job name `verify-source-branch` stable — it is referenced by name as a
# required status check in the "Main Protection" ruleset.
#
# Policy:
#   main            <- only  release-phase-2  or  planning/phase-2-e2e
#   release-phase-2 <- only  dev/*  or  fix/*  or  planning/phase-2-e2e
#
# `dev/*` is the Phase-2 implementation prefix — one branch per phase, branched
# from an up-to-date release-phase-2 and merged back into it at the phase gate
# (e.g. dev/backend-phase-1-data-layer). planning/phase-2-e2e carries plans,
# architecture, and the tracker only. release-phase-2 -> main is the final merge.
#
# `fix/*` (added 2026-08-15) covers repairs that belong to no phase — tooling and
# CI defects found mid-build, e.g. fix/quality-gate-implicit-paths. Without it the
# only way to land such a fix was to disguise it as a phase branch, which would
# have made the tracker lie about what a `dev/*` branch means. Note ci.yml's
# branch-convention check already accepts fix/, so the guard was the narrower of
# the two rules; this aligns them. `main` is unchanged and stays strict.
#
# Entries are shell glob patterns, so `dev/*` matches any phase branch.
# (edit the ALLOWED lists below to change who may target each branch)

on:
  pull_request:
    branches: [main, release-phase-2]

jobs:
  verify-source-branch:
    name: verify-source-branch
    runs-on: ubuntu-latest
    steps:
      - name: Ensure the PR source branch is allowed for this target
        run: |
          BASE="${{ github.base_ref }}"
          HEAD="${{ github.head_ref }}"
          echo "PR: $HEAD -> $BASE"
          case "$BASE" in
            main)
              ALLOWED="release-phase-2 planning/phase-2-e2e" ;;
            release-phase-2)
              ALLOWED="dev/* fix/* planning/phase-2-e2e" ;;
            *)
              echo "No source restriction configured for base '$BASE'."; exit 0 ;;
          esac
          for pattern in $ALLOWED; do
            # $pattern is deliberately unquoted — `case` glob-matches it.
            case "$HEAD" in
              $pattern)
                echo "✅ '$HEAD' -> '$BASE' is allowed (matched '$pattern')."; exit 0 ;;
            esac
          done
          echo "::error::'$BASE' only accepts merges from: $ALLOWED — this PR is from '$HEAD'."
          exit 1
