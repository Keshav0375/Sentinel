name: "[sentinel] PR — validation"

# Fast PR gate (backend.md §9.1; decisions 2026-10-24 "Backend phase 8"). No ACR, no AKS, no
# Azure login, no secrets: it runs on forks too. Deploy happens only on merge (ci_backend_deployment.yml).
on:
  pull_request:
    branches: [main, release-phase-2]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "Dockerfile"
      - "azure/**"
      - "alembic/**"
      - "alembic.ini"
      - "scripts/**"
      - ".github/workflows/**"
      - ".github/actions/**"

permissions:
  contents: read

concurrency:
  group: ci-validation-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.12"
  # Pins match ci.yml and the Dockerfile.
  POETRY_VERSION: "2.5.1"
  POETRY_PLUGIN_EXPORT_VERSION: "1.10.1"

jobs:
  # ── 1. Quality: lint, format, types ──────────────────────────────────────
  run-quality:
    name: Run Quality Checks
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}
          restore-keys: pip-${{ runner.os }}-${{ runner.arch }}-${{ env.PYTHON_VERSION }}-

      # Poetry only exports the lock; it lives in its own venv (as pipx would put it, but pipx is
      # not guaranteed on the arm image), so its dependencies never enter the interpreter below.
      - name: Install Poetry + export plugin
        run: |
          python -m venv "$RUNNER_TEMP/poetry"
          "$RUNNER_TEMP/poetry/bin/pip" install --disable-pip-version-check \
            "poetry==${POETRY_VERSION}" "poetry-plugin-export==${POETRY_PLUGIN_EXPORT_VERSION}"
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$RUNNER_TEMP/poetry/bin/poetry" "$RUNNER_TEMP/bin/poetry"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Exactly the poetry.lock set (main + dev), hash checked, CPU-only torch (see ci.yml).
      - name: Install locked dependencies (CPU-only torch)
        run: python scripts/install_locked.py

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Ruff format
        run: ruff format --check src/ tests/

      - name: Pyright type check
        run: pyright src/

  # ── 2. Build, boot and test in ONE job (§9.1 single-runner rule) ─────────
  # A locally built image or running container does not exist in another job's VM.
  build-and-test:
    name: Build Image and Run Tests
    needs: run-quality
    runs-on: ubuntu-24.04-arm
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The container is on the bridge network (-p 8000:8000): it reaches the service through
      # the host's published 5432. The host-side tests use localhost.
      CONTAINER_DATABASE_URL: "postgresql://postgres:test@host.docker.internal:5432/sentinel"
      TEST_DATABASE_URL: "postgresql://postgres:test@localhost:5432/sentinel"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}
          restore-keys: pip-${{ runner.os }}-${{ runner.arch }}-${{ env.PYTHON_VERSION }}-

      - name: Install Poetry + export plugin
        run: |
          python -m venv "$RUNNER_TEMP/poetry"
          "$RUNNER_TEMP/poetry/bin/pip" install --disable-pip-version-check \
            "poetry==${POETRY_VERSION}" "poetry-plugin-export==${POETRY_PLUGIN_EXPORT_VERSION}"
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$RUNNER_TEMP/poetry/bin/poetry" "$RUNNER_TEMP/bin/poetry"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install locked dependencies (CPU-only torch)
        run: python scripts/install_locked.py

      # The pytest session migrates TEST_DATABASE_URL; 002_seed_services embeds with the real model.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Build image (local, no push)
        id: build
        run: docker build --tag sentinel-backend:test .

      # The pool registers the pgvector codec on every connection, so the schema must exist
      # before the app boots. Migrated by the image itself (baked model, offline).
      - name: Migrate the database with the image
        id: migrate
        run: |
          docker run --rm \
            --add-host host.docker.internal:host-gateway \
            -e DATABASE_URL="$CONTAINER_DATABASE_URL" \
            sentinel-backend:test alembic upgrade head

      # Stub LLM (no key is read); dummy API tenant/audience GUIDs (the JWKS is fetched only
      # when a bearer token is validated, which never happens here).
      - name: Run the backend container
        id: run
        run: |
          docker run -d --name sentinel-backend -p 8000:8000 \
            --add-host host.docker.internal:host-gateway \
            -e DATABASE_URL="$CONTAINER_DATABASE_URL" \
            -e SENTINEL_FAKE_LLM=1 \
            -e SENTINEL_API_TENANT_ID=00000000-0000-0000-0000-000000000000 \
            -e SENTINEL_API_AUDIENCE=00000000-0000-0000-0000-000000000001 \
            sentinel-backend:test

      - name: Wait for /health (max 30 s)
        id: health
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 2 -o /dev/null http://localhost:8000/health; then
              echo "/health answered 200"
              exit 0
            fi
            sleep 1
          done
          echo "::error::/health did not answer 200 within 30 s"
          exit 1

      - name: Check /ready
        id: ready
        run: curl -fsS --max-time 5 http://localhost:8000/ready

      - name: Unit tests
        id: unit
        run: python -m pytest tests/test_tools/ tests/test_models/ -x --tb=short -q

      - name: Integration tests
        id: integration
        run: python -m pytest tests/test_agents/ tests/test_api/ -x --tb=short -q

      - name: Container logs
        id: logs
        if: failure()
        run: docker logs sentinel-backend || true

      - name: Stop and remove the container
        id: teardown
        if: always()
        run: |
          docker stop sentinel-backend || true
          docker rm sentinel-backend || true
