# Mint an Entra bearer token for the Sentinel API (backend task 7.3). The audience input is the API audience comma
# list (vars.SENTINEL_API_AUDIENCE: client-id GUID first, optionally the identifier URI); the token is requested for
# the first entry, which must be a GUID.
# Caller: azure/login in the identity tenant (where the API app registration lives).
name: Sentinel get-backend-token
description: >-
  Mint an Entra bearer token for the Sentinel API (masked).
  Caller: azure/login in the identity tenant first.

inputs:
  audience:
    description: >-
      The API audience comma list (vars.SENTINEL_API_AUDIENCE: client-id GUID first, optionally the identifier
      URI); the token is requested for the first entry, which must be a GUID.
    required: true
  tenant:
    description: Tenant to mint the token in (optional).
    required: false
    default: ''

outputs:
  bearer:
    description: Entra access token for the API (masked).
    value: ${{ steps.token.outputs.bearer }}

runs:
  using: composite
  steps:
    - id: token
      name: Mint the API bearer token
      shell: bash
      env:
        AUDIENCE: ${{ inputs.audience }}
        TENANT: ${{ inputs.tenant }}
      run: |
        set -euo pipefail
        die() { echo "::error::get-backend-token: $1"; exit 1; }
        [ -n "${AUDIENCE:-}" ] || die "input audience is empty"
        first="$(printf '%s' "${AUDIENCE%%,*}" | tr -d '[:space:]')"
        guid_re='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
        [[ "$first" =~ $guid_re ]] || die "the first entry of input audience is not a GUID"
        args=(--scope "$first/.default" --query accessToken -o tsv)
        if [ -n "${TENANT:-}" ]; then
          args+=(--tenant "$TENANT")
        fi
        token="$(az account get-access-token "${args[@]}")"
        [ -n "$token" ] || die "az returned an empty token"
        case "$token" in *$'\n'*) die "token is not a single line";; esac
        echo "::add-mask::$token"
        echo "bearer=$token" >> "$GITHUB_OUTPUT"
