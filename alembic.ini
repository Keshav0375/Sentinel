# Alembic config for the Postgres + pgvector schema (backend.md §5.3).
#
#   poetry run alembic upgrade head      # apply every migration
#   poetry run alembic downgrade base    # drop the schema (keeps the vector extension)
#   poetry run alembic upgrade head --sql  # print the DDL without connecting
#
# The connection string is NOT kept here: alembic/env.py reads DATABASE_URL (from the
# environment, else .env) — the same postgresql:// DSN the app's asyncpg pool uses.

[alembic]
script_location = %(here)s/alembic
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
